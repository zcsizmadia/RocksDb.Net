name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # The native library is platform-specific, so the tests have to run on every
    # OS the runtimes package ships for, not just Linux.
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        # The 8 and 9 runtimes are needed to *run* the tests for those target
        # frameworks, not just to build them.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Build
      shell: bash
      run: |
        dotnet restore
        # -warnaserror keeps the build warning-free: a new warning fails CI
        # rather than accumulating unnoticed.
        dotnet build -c Release --no-restore -warnaserror

    - name: Test
      shell: bash
      env:
        # Each test creates and deletes its own RocksDb database, so a run is a
        # few thousand short-lived files, and the three target frameworks run
        # concurrently. On the Windows runner the default temp directory is on
        # the OS volume, which is markedly slower than the workspace volume that
        # RUNNER_TEMP points at. Path.GetTempPath honours TMP and TEMP, so this
        # moves that churn onto the faster disk.
        TMP: ${{ runner.temp }}
        TEMP: ${{ runner.temp }}
      run: |
        # --blame-hang turns a hung test run into a report naming the test that
        # stopped responding, instead of the job stalling until the six-hour
        # runner limit. A macOS net8.0 run once sat for fourteen minutes with no
        # output while net9.0 and net10.0 finished in about twenty seconds each,
        # and the log could say nothing about which test it was.
        #
        # The whole suite takes well under a minute on every runner, so five
        # minutes is generous enough not to fire on a slow machine.
        #
        # --blame-crash covers the other failure, which the hang settings alone
        # could not explain. An Ubuntu net10.0 run died after 968 of 979 tests
        # with "Test host process crashed", and because the crash left the run
        # dangling the hang timer then elapsed on top of it, so the job looked
        # like a hang and was really a crash. Blame named no test, meaning none
        # was executing and the fault came from a background thread, most
        # likely the finalizer. With no crash dump there was nothing further to
        # go on.
        #
        # Mini rather than full: a full dump of a test host with a native
        # database engine loaded is enormous, and the faulting stack is what is
        # actually wanted.
        dotnet test -c Release --no-build \
          --blame-crash \
          --blame-crash-dump-type mini \
          --blame-hang-timeout 5m \
          --blame-hang-dump-type none \
          --collect:"XPlat Code Coverage" \
          --results-directory TestResults

    - name: Upload test results on failure
      # Only on failure, so a green run carries no cost. This is what makes the
      # crash settings above worth having: the sequence file records the order
      # tests ran in, which narrows an unattributed crash to the tests around
      # it, and any dump carries the faulting stack.
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: |
          TestResults/**/Sequence_*.xml
          TestResults/**/*.dmp
          TestResults/**/*.core*
        if-no-files-found: ignore
        retention-days: 14

    - name: Check coverage
      # Linux only: one check is enough, and the number does not vary by OS.
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        # A ratchet, not a target. Raise it when coverage rises so it cannot
        # quietly fall back; never lower it to make a change pass. Changing this
        # number is a deliberate, reviewable edit.
        MINIMUM_LINE_COVERAGE: 92
      run: |
        # Read the line rate straight out of the Cobertura report rather than
        # taking a dependency on a coverage action.
        # Neither of these pipes into head any more. Under `set -o pipefail`,
        # head exiting after the first line makes the upstream command fail on a
        # broken pipe, and `-e` then aborts the step. It only bites once the
        # upstream still has output buffered when head closes the pipe, so it
        # lay dormant until the coverage report grew past that point and then
        # failed the gate with `sed: couldn't flush stdout: Broken pipe` rather
        # than with a coverage number. Both commands now stop on their own.
        report=$(find TestResults -name 'coverage.cobertura.xml' -print -quit)
        if [ -z "$report" ]; then
          echo "::error::No coverage report was produced."
          exit 1
        fi

        # One awk, no pipe: it finds the first line-rate, converts it and exits.
        # The document's own rate is the first one in the file; the rest belong
        # to individual classes.
        percent=$(awk 'match($0, /line-rate="[0-9.]+"/) {
                         rate = substr($0, RSTART + 11, RLENGTH - 12)
                         printf "%.1f", rate * 100
                         exit
                       }' "$report")

        if [ -z "$percent" ]; then
          echo "::error::Could not read a line rate out of $report."
          exit 1
        fi

        {
          echo "## Coverage"
          echo
          echo "Line coverage: **${percent}%** (floor ${MINIMUM_LINE_COVERAGE}%)"
          echo
          echo "Full Cobertura report is attached as the \`coverage\` artifact."
        } >> "$GITHUB_STEP_SUMMARY"

        if awk -v p="$percent" -v m="$MINIMUM_LINE_COVERAGE" 'BEGIN { exit !(p < m) }'; then
          echo "::error::Line coverage ${percent}% is below the ${MINIMUM_LINE_COVERAGE}% floor."
          exit 1
        fi

        echo "Line coverage ${percent}% meets the ${MINIMUM_LINE_COVERAGE}% floor."

    - name: Upload coverage report
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: TestResults/**/coverage.cobertura.xml

    - name: Pack NuGet package
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        dotnet pack -c Release --no-build -o nupkgs

    - name: Upload NuGet package artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: nupkgs/*.nupkg

  aot:
    name: NativeAOT
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x

    - name: Install the AOT toolchain
      # ILC needs a native linker. Nothing else in the build does, so this is
      # the only job that pays for it.
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev

    - name: Publish and run samples with PublishAot
      shell: bash
      run: |
        # Publishing is not enough on its own, and neither are the analysers.
        # IsAotCompatible on the library turns on the trim and AOT analysers, so
        # a build already reports what they can see — but they cannot see a
        # native library that fails to load next to an AOT-published executable,
        # or a callback that faults once the runtime is gone. Both of those are
        # the likely failures for this library, so the samples are run and their
        # exit codes checked.
        #
        # Two samples on purpose. BasicSample covers open, put, get, delete and
        # close, which is the native library resolution path. MergeOperatorSample
        # covers a managed callback reached from native code through an
        # [UnmanagedCallersOnly] function pointer, which is the part most likely
        # to break and least likely to be caught by anything else.
        #
        # Linux only. PublishAot needs a platform toolchain on each runner and
        # one answer to "does this work under AOT" is enough; Windows can follow
        # if it turns out to be cheap.
        for sample in BasicSample MergeOperatorSample; do
          echo "::group::$sample"
          out="$(mktemp -d)"
          dotnet publish "Samples/$sample" -c Release -r linux-x64 \
            -p:PublishAot=true -warnaserror -o "$out"
          (cd "$out" && "./$sample")
          echo "::endgroup::"
        done
