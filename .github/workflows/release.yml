name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases in progress

jobs:
  release:
    runs-on: ubuntu-latest
    # No `if:` guard here on purpose. This job used to be skipped unless
    # `github.event.release.target_commitish` was exactly 'main', which failed
    # by doing nothing: a release created against a SHA or another branch
    # produced a green, empty run and never published. The equivalent check now
    # runs as a step below, where it can fail loudly instead. The old condition
    # also carried `|| github.ref == 'refs/heads/main'`, which is dead on a
    # release event because github.ref is the tag ref.
    permissions:
      actions: read     # To download from build.yml
      contents: write   # To upload assets to the Release
      packages: write   # To push to GitHub Packages

    steps:
      - uses: actions/checkout@v7
        with:
          # Needed for the ancestry check below, which compares the tagged
          # commit against main.
          fetch-depth: 0

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Check the tag is on main
        shell: bash
        run: |
          # The intent is that only commits that reached main get published.
          # Asking git whether the tagged commit is an ancestor of main states
          # that directly, and unlike reading target_commitish it holds however
          # the release was created: that field can be a branch name, a tag
          # name, or a SHA depending on how the release was made, so comparing
          # it to the string 'main' both missed valid releases and would have
          # accepted a tag that had been force-moved off main.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not an ancestor of main, so it is not published."
            exit 1
          fi
          echo "Tagged commit $GITHUB_SHA is on main."

      - name: Download nupkg built from the tagged commit
        uses: dawidd6/action-download-artifact@v23
        with:
          workflow: build.yml
          workflow_conclusion: success
          # Pinned to the tagged commit, which is the whole point. Taking the
          # latest successful build on main instead meant anything merged
          # between tagging and publishing changed what shipped, while the
          # version string still matched and the check below still passed.
          # Pinning also keeps the guarantee that what is published is exactly
          # what CI tested, rather than a fresh build made here.
          commit: ${{ github.sha }}
          name: nuget-package
          path: ./nupkgs
          check_artifacts: true    # Ensures the workflow actually has the named artifact
          search_artifacts: true   # Finds the latest run that actually contains this artifact

      - name: Check nupkg version
        shell: bash
        run: |
          # Get version from the tag (stripping 'v' prefix if present)
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          echo "Validating version: $TAG_VERSION"

          # Extract version from csproj
          PROJECT_VERSION="$(dotnet msbuild RocksDb.Net/ -getProperty:Version -nologo -v:q | tr -d '\r' | xargs)"

          # Check if the tag version matches the project version
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Version mismatch! Tag ($TAG_VERSION) != Project ($PROJECT_VERSION)"
            exit 1
          fi

          # Path to the specific nupkg we want
          TARGET_NUPKG="./nupkgs/RocksDb.Net.$TAG_VERSION.nupkg"

          # Verify the file exists with that version
          if [[ ! -f "$TARGET_NUPKG" ]]; then
            echo "::error::Could not find nupkg for version $TAG_VERSION in downloaded artifacts"
            exit 1
          fi

          # Export variables for later steps
          echo "TARGET_NUPKG=$TARGET_NUPKG" >> "$GITHUB_ENV"

      - name: Attach Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload --clobber ${{ github.event.release.tag_name }} "$TARGET_NUPKG"

      - name: Publish to NuGet.org
        shell: bash
        run: |
          dotnet nuget push "$TARGET_NUPKG" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "$TARGET_NUPKG" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
