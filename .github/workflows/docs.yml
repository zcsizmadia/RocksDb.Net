name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'RocksDb.Net/**'
      - 'docs/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'RocksDb.Net/**'
      - 'docs/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Only the newest run needs to publish; cancel any earlier one still going.
concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore tools
      run: dotnet tool restore

    - name: Build the site
      # DocFX reads the compiled project for its metadata, so the library has to
      # build first. --warningsAsErrors makes a broken cref or a dead link fail
      # the run rather than silently publishing a hole in the docs.
      run: |
        dotnet build RocksDb.Net/RocksDb.Net.csproj -c Release
        dotnet docfx docs/docfx.json --warningsAsErrors

    - name: Upload the site
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_site

  deploy:
    name: Deploy to Pages
    # Pull requests build the site but do not publish it, so a docs break fails
    # the PR instead of reaching the live site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Deploy
      id: deploy
      uses: actions/deploy-pages@v5
