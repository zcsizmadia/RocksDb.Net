name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Lint Markdown
      # Run the tool directly at a pinned version rather than through an action,
      # so the only dependency is the package itself. Rules live in
      # .markdownlint.jsonc, which markdownlint-cli2 discovers on its own.
      run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#**/node_modules/**"

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Check the generated files are up to date
      # Regenerate from the pinned RocksDb version and fail if the result
      # differs from what is committed. This catches three things a build cannot:
      # a hand edit to a generated file, a generator change that was never
      # regenerated, and a RocksDbVersion bump where the output was left behind.
      # The last one matters most, since the P/Invoke signatures would then
      # describe a different native library than the one being loaded, and the
      # statistics enums would name counters by the wrong number.
      shell: bash
      run: |
        version="$(dotnet msbuild RocksDb.Net/ -getProperty:RocksDbVersion -nologo -v:q | tr -d '\r' | xargs)"
        echo "Regenerating for RocksDb $version"

        # No --version, so this runs the command the README documents and the
        # generator resolves the version itself. Its first line reports what it
        # resolved, which is checked against msbuild's own evaluation of the
        # property: if the generator ever read that file differently from
        # msbuild, every binding would be generated for the wrong library and
        # nothing else here would notice.
        dotnet run --project NativeMethodsGenerator -c Release | tee generator.log

        if ! grep -qE "^RocksDb version : ${version}([[:space:]]|\$)" generator.log; then
          echo "::error::The generator did not resolve RocksDb $version. It reported:"
          head -1 generator.log
          exit 1
        fi

        rm -f generator.log

        if ! git diff --exit-code -- RocksDb.Net/Native/NativeMethods.g.cs RocksDb.Net/StatisticsEnums.g.cs; then
          echo "::error::The generated files do not match a fresh generation for RocksDb $version. Re-run the generator and commit the result."
          exit 1
        fi

        echo "Generated files match the generator output."

    - name: Check the docs match the pinned version and function count
      # The RocksDb version and the binding count appear in prose in several
      # files. Nothing generates those files, so the numbers went stale: the
      # README claimed 1,047 functions when there were 1,745. Rather than
      # templating the markdown, this asserts the numbers still agree with the
      # single sources of truth, so drift fails CI instead of shipping.
      #
      # Historical CHANGELOG entries are deliberately not checked. An entry
      # records what a past release contained and must keep its own numbers.
      shell: bash
      run: |
        version="$(dotnet msbuild RocksDb.Net/ -getProperty:RocksDbVersion -nologo -v:q | tr -d '\r' | xargs)"
        count="$(grep -c 'LibraryImport' RocksDb.Net/Native/NativeMethods.g.cs)"
        # The prose writes the count both bare and comma-grouped. Grouping with
        # sed rather than printf "%'d", because that format depends on the
        # locale and the runner's C.UTF-8 would produce no separator at all.
        grouped="$(echo "$count" | sed -E ':a;s/([0-9])([0-9]{3})($|,)/\1,\2\3/;ta')"

        echo "Expecting RocksDb $version and $count bindings ($grouped)."

        failed=0

        check() {
          local file="$1" needle="$2" what="$3"
          if ! grep -qF -- "$needle" "$file"; then
            echo "::error file=$file::Expected to find $what here. Looked for '$needle'."
            failed=1
          fi
        }

        # The version badge in the README. The generator command below it does
        # not repeat the version any more, since the generator reads it from
        # Directory.Build.props, so there is nothing there to go stale.
        check README.md "RocksDb-${version}-blue" "the current version in the RocksDb badge"

        # The binding count, where each file happens to format it.
        check README.md "(${grouped} functions)" "the current binding count"
        check docs/api/index.md "There are ${count} of them" "the current binding count"

        # Every stale mention of a version this project no longer pins is worth
        # catching too, since a bump leaves the old number behind in prose.
        stale="$(grep -rn --include='*.md' -E 'RocksDb-[0-9]+\.[0-9]+\.[0-9]+-blue|--version [0-9]+\.[0-9]+\.[0-9]+' . \
                   | grep -vF "$version" || true)"
        if [ -n "$stale" ]; then
          echo "::error::These mention a RocksDb version other than the pinned $version:"
          echo "$stale"
          failed=1
        fi

        if [ "$failed" -ne 0 ]; then
          exit 1
        fi

        echo "Docs agree with RocksDb $version and $count bindings."

  actions:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Lint workflows
      # actionlint ships a static binary, so pinning a release is simpler and
      # more transparent than an action or an install script. It bundles
      # shellcheck integration, which also covers the bash in our run steps.
      env:
        ACTIONLINT_VERSION: 1.7.12
      run: |
        curl -fsSL -o actionlint.tar.gz \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        tar -xzf actionlint.tar.gz actionlint
        ./actionlint -no-color -oneline
